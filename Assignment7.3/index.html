<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Online Store</h1>
        <p>Discover quality products at affordable prices.</p>
    </header>

    <main class="container">
        <h2>Our Products</h2>

        <section class="product-list">

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                     alt="Wireless headphones">
                <h3>Wireless Headphones</h3>
                <p class="price">₹1,499</p>
                <button type="button">Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                     alt="Classic wristwatch">
                <h3>Classic Watch</h3>
                <p class="price">₹2,299</p>
                <button type="button">Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80"
                     alt="Digital camera">
                <h3>Digital Camera</h3>
                <p class="price">₹5,999</p>
                <button type="button">Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
                     alt="Red sports shoes">
                <h3>Sports Shoes</h3>
                <p class="price">₹1,899</p>
                <button type="button">Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=500&q=80"
                     alt="Over-ear headphones">
                <h3>Premium Headphones</h3>
                <p class="price">₹2,499</p>
                <button type="button">Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="https://images.unsplash.com/photo-1524813686514-a57563d77965?auto=format&fit=crop&w=500&q=80"
                     alt="Stylish sunglasses">
                <h3>Stylish Sunglasses</h3>
                <p class="price">₹999</p>
                <button type="button">Add to Cart</button>
            </article>

        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 My Online Store. All rights reserved.</p>
    </footer>

</body>
</html>
